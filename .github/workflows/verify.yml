name: Verify portable edition
on: [push, pull_request]
jobs:
  public-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - name: Install included artwork without developer files
        run: node --input-type=module -e "import {prepareLinkedRuntime} from './tools/linked-runtime.mjs'; await prepareLinkedRuntime();"
  integration-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build integration/runtime/core/CoreContract.csproj --configuration Release
      - run: dotnet build integration/runtime/app-observer/AppObserver.csproj --configuration Release
